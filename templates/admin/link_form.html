{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">{{ 'Sửa link' if link else 'Tạo link mới' }}</h3>
  <a class="btn btn-outline-secondary" href="{{ url_for('admin_links') }}">Quay lại</a>
</div>
<form method="post" enctype="multipart/form-data" class="row g-3">
  <div class="col-md-6">
    <label class="form-label">Slug</label>
    <input class="form-control" name="slug" value="{{ link.slug if link else '' }}" placeholder="tùy chọn, để trống sẽ tự tạo">
  </div>
  <div class="col-md-6">
    <label class="form-label">URL gốc (hiển thị meta)</label>
    <input class="form-control" name="target_url" value="{{ link.target_url if link else '' }}" placeholder="https://example.com">
  </div>
  <div class="col-md-6">
    <label class="form-label">Shopee URL</label>
    <input class="form-control" name="shopee_url" value="{{ link.shopee_url if link else 'https://shopee.vn' }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">Telegram URL</label>
    <input class="form-control" name="telegram_url" value="{{ link.telegram_url if link else 'https://t.me' }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">Meta title</label>
    <input class="form-control" name="meta_title" value="{{ link.meta_title if link else '' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Meta description</label>
    <input class="form-control" name="meta_description" value="{{ link.meta_description if link else '' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Ảnh meta (tải lên)</label>
    {% if link and link.meta_image %}
      <div class="mb-2"><img src="{{ link.meta_image }}" alt="meta" height="60"></div>
    {% endif %}
    <input class="form-control" type="file" name="meta_image" accept="image/*">
  </div>
  <div class="col-12">
    <label class="form-label">Nội dung hiển thị</label>
    <textarea class="form-control" rows="4" name="body_content" placeholder="Mô tả, hướng dẫn...">{{ link.body_content if link else '' }}</textarea>
  </div>
  <div class="col-12">
    <button class="btn btn-success" type="submit">Lưu</button>
  </div>
</form>
{% endblock %}
