services:
  api:
    build: .
    container_name: matchbot_api
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/matchbot
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: super-secret-key
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  db:
    image: postgres:16
    container_name: matchbot_db
    environment:
      POSTGRES_DB: matchbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: matchbot_redis
    ports:
      - "6379:6379"

volumes:
  pg_data:
